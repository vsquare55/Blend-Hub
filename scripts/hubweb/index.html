<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blend Hub</title>
<link rel="icon" href="logo.png">
<style>
:root{
  --bg:#F5F6FA; --card:#FFFFFF; --ink:#16213A; --mute:#6B7690; --line:#E4E8F0; --soft:#EEF1F7;
  --navy:#1B2F5B; --red:#D81F26; --amber:#F4A21E; --blue:#2C6BED;
  --ok:#17935F; --okbg:#E3F5EC; --p1:#2C6BED; --p1bg:#E5EEFF; --p2:#7A4FE0; --p2bg:#EFE9FD; --pre:#C27A06; --prebg:#FFF1D6; --hold:#6B7690; --holdbg:#ECEFF5;
  --shadow:0 1px 2px rgba(22,33,58,.05),0 6px 20px rgba(22,33,58,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--navy)}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);height:100vh}body.nosb .app{grid-template-columns:minmax(0,1fr)}body.nosb .side{display:none}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;overflow:auto}
.side img.logo{width:146px;margin:2px 6px 18px}
.nav button{display:flex;gap:11px;align-items:center;width:100%;padding:9px 12px;border:0;background:none;border-radius:10px;color:var(--mute);font-weight:550;cursor:pointer;text-align:left;margin-bottom:2px}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button.on{background:linear-gradient(90deg,#FDECEC,#FFF3DF);color:var(--navy)}
.nav button.on svg{color:var(--red)}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.side .foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.side .me{display:flex;gap:9px;align-items:center;margin-bottom:8px;cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--amber));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.lockpill{display:inline-flex;gap:6px;align-items:center;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.lockpill.rw{background:var(--okbg);color:var(--ok)} .lockpill.ro{background:#FDE7E8;color:var(--red)}
.main{overflow:auto;padding:24px 28px 80px;min-width:0}
.top{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.top h1{font-size:24px} .top .sub{color:var(--mute);margin-top:2px}.top .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 13px;font-weight:600;cursor:pointer;box-shadow:0 1px 1px rgba(22,33,58,.04);white-space:nowrap}
.btn:hover{border-color:#C9D0E0}.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:3px 10px;font-size:12.5px;border-radius:8px}.btn.ghost{background:none;box-shadow:none}.btn.dng{color:var(--red)}
.banner{background:#FFF4E5;border:1px solid #FFD9A3;color:#7A4A00;padding:10px 14px;border-radius:12px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:12px 15px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c,var(--navy))}
.kpi .n{font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--c,var(--navy));line-height:1.15}
.kpi .l{color:var(--mute);font-size:12.5px;font-weight:600}.kpi.on{border-color:var(--c,var(--navy))}
.bosses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.boc{background:var(--card);border-radius:14px;padding:11px 15px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;display:flex;gap:12px;align-items:center}
.boc.on{border-color:var(--navy)}.boc .boss{width:34px;height:34px;font-size:13px;background:var(--navy);color:#fff}
.boc b{font-size:18px}.boc small{display:block;color:var(--mute)}.boc .od{color:var(--red);font-weight:700}
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ms{position:relative}
.ms>button,.sel{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:550;color:var(--ink);display:flex;gap:6px;align-items:center}
.ms>button.has{border-color:var(--navy);background:#EEF2FB;color:var(--navy)}
.ms>button:after{content:"▾";color:var(--mute);font-size:11px}
.pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:230px;max-height:340px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(22,33,58,.18);display:flex;flex-direction:column;overflow:hidden}
.pop input[type=search]{margin:10px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:none}
.pop .opts{overflow:auto;padding:0 6px 6px}
.pop label{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}.pop label:hover{background:var(--soft)}
.pop .pf{border-top:1px solid var(--line);padding:8px 10px;display:flex;justify-content:space-between}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 12px;border-radius:99px;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{border:1px solid var(--line);border-radius:99px;padding:6px 14px;min-width:200px;outline:none;background:#fff}.search:focus{border-color:var(--navy)}
.tablewrap{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 330px);min-height:240px}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;background:#FAFBFD;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2;cursor:pointer;user-select:none}
th.nosort{cursor:default}th .ar{color:var(--red)}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:#FAFBFF}tr.row.pk td{background:#F1F5FF}
tr.grp td{background:var(--soft);font-weight:700;color:var(--navy);padding:7px 12px}
.tn{font-weight:620}.tn small{display:block;color:var(--mute);font-weight:500;margin-top:1px}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:650;font-size:12px;white-space:nowrap}
.st.Tie-up-done{background:var(--okbg);color:var(--ok)}.st.P1{background:var(--p1bg);color:var(--p1)}.st.P2{background:var(--p2bg);color:var(--p2)}
.st.Preliminary{background:var(--prebg);color:var(--pre)}.st.On-hold{background:var(--holdbg);color:var(--hold)}
.ct{font-size:12px;font-weight:650;padding:2px 9px;border-radius:7px;white-space:nowrap}
.ct.Government{background:#E7EEFB;color:#27508F}.ct.SOE{background:#E9F6F4;color:#12756B}.ct.Private{background:#FCEBE9;color:#B33A2B}.ct.To-confirm{background:var(--soft);color:var(--mute)}
.chip{display:inline-block;margin:0 3px 3px 0;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.chip.Shortlisted{background:#E5EEFF;color:#1F54C4}.chip.Approached{background:#EFE9FD;color:#6238CF}.chip.In-discussion{background:#FFF1D6;color:#8F5A00}
.chip.Term-sheet-received{background:#E1F3F3;color:#0E6E73}.chip.Appointed{background:var(--okbg);color:var(--ok)}.chip.Identified{background:#fff;color:var(--mute);border-color:var(--line)}
.chip.To-be-approached{background:#FFE9E3;color:#B4421F}.chip.brought{background:#FFF7E0;color:#8A6100;border:1px dashed #D9A400}.nn b{font-style:normal;color:#8A6100}
.chip.Dropped{background:#fff;color:#A0A8BA;text-decoration:line-through;border-color:var(--line)}
.none{color:#B6BDCD}.nn{color:#9AA3B8;font-size:12px;font-style:italic}
.ready{display:flex;gap:7px;align-items:center;min-width:86px;font-size:12px;color:var(--mute)}
.bar{flex:1;height:6px;border-radius:9px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--ok))}
.boss{width:26px;height:26px;border-radius:8px;background:var(--soft);display:inline-grid;place-items:center;font-weight:700;font-size:11px;color:var(--navy)}
.dim{opacity:.55}.tag{font-size:11px;background:var(--soft);color:var(--mute);padding:1px 7px;border-radius:6px;margin-left:6px;font-weight:600}.tag.red{background:#FDE7E8;color:var(--red)}
.empty{padding:46px;text-align:center;color:var(--mute)}
.bulk{position:sticky;bottom:12px;z-index:30;background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 12px 30px rgba(22,33,58,.35);margin-top:12px}
.bulk select,.bulk input[type=date]{border:0;border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink);max-width:170px}.bulk .bl{font-size:12px;color:#ffffffcc;display:inline-flex;gap:6px;align-items:center}
.bulk .btn{background:#ffffff1c;color:#fff;border-color:#ffffff33}.bulk .btn.dng{background:var(--red);border-color:var(--red)}
.shade{position:fixed;inset:0;background:rgba(22,33,58,.35);z-index:50;opacity:0;pointer-events:none;transition:.2s}.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(740px,100vw);background:#fff;z-index:60;box-shadow:-20px 0 60px rgba(22,33,58,.2);transform:translateX(102%);transition:transform .2s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:18px 24px 0;border-bottom:1px solid var(--line)}
.dh .x{float:right;font-size:22px;border:0;background:none;cursor:pointer;color:var(--mute)}
.dh h2{font-size:19px;padding-right:30px;outline:none;border-radius:6px}.dh h2:focus{background:var(--soft)}
.tabs{display:flex;gap:2px;margin-top:10px;overflow:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--navy);border-color:var(--red)}
.db{padding:18px 24px 40px;overflow:auto;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fld label{display:block;font-size:11.5px;font-weight:650;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.fld input,.fld select,.fld textarea,.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:7px 11px;background:#fff;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus,.in:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,47,91,.08)}
.fld textarea{min-height:88px;resize:vertical}.fld.full{grid-column:1/-1}
.sec{margin:20px 0 10px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:10px}.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.chk{display:grid;grid-template-columns:190px auto 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.opt{display:inline-flex;background:var(--soft);border-radius:9px;padding:2px}
.opt button{border:0;background:none;padding:4px 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--mute);cursor:pointer}
.opt button.on.Yes{background:var(--ok);color:#fff}.opt button.on.In-progress{background:var(--amber);color:#fff}.opt button.on.No{background:var(--red);color:#fff}.opt button.on.N-A-{background:var(--hold);color:#fff}
.lk{display:grid;grid-template-columns:1fr 150px 1fr 28px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.lk .nm{font-weight:620}.lk select,.lk input{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;width:100%}
.addrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.addrow input{flex:1;min-width:140px;border:1px solid var(--line);border-radius:9px;padding:7px 11px}.addrow select{border:1px solid var(--line);border-radius:9px;padding:6px}
.nnbox{display:flex;align-items:center;gap:8px;color:var(--mute)}
.log{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px}.log small{color:var(--mute)}.log>div{flex:1}
.cm{padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#FCFCFE}.cm small{color:var(--mute)}.cm .t{white-space:pre-wrap;margin-top:3px}
.act{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.act.done .t{text-decoration:line-through;color:var(--mute)}.act .t{flex:1}
.kv{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px 16px;min-width:120px}.stat .n{font-size:24px;font-weight:700;color:var(--navy)}.stat .l{color:var(--mute);font-size:12px;font-weight:600}
.two{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.plist{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.plist .items{max-height:calc(100vh - 280px);overflow:auto}
.plist .seg button{padding:5px 10px;font-size:12.5px}
.pi{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.pi:hover{background:#FAFBFF}.pi.on{background:linear-gradient(90deg,#FDECEC,#FFF3DF)}.pi b{font-weight:620}.pi small{color:var(--mute);display:block}.pi .c{color:var(--mute);font-size:12px;text-align:right;white-space:nowrap}
.card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.help{color:var(--mute);max-width:780px}.help li{margin-bottom:6px}
.dc{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px;border-left:4px solid var(--c,var(--line))}
.dc .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.dc .hd b{font-size:15.5px;cursor:pointer}.dc .hd b:hover{color:var(--red)}
.dc .meta{color:var(--mute);font-size:12.5px;margin:3px 0 6px}.dc .lc{background:var(--soft);border-radius:10px;padding:7px 10px;font-size:13px;margin:6px 0;white-space:pre-wrap}
.dc .qc{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.dc .qc textarea{flex:1;min-width:200px;height:38px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;resize:vertical;outline:none}
.flag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:7px;background:#FDE7E8;color:var(--red)}.flag.amb{background:#FFF1D6;color:#8F5A00}.flag.gr{background:var(--soft);color:var(--mute)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:80vw}.toast.err{background:var(--red)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(22,33,58,.45);display:grid;place-items:center;padding:16px}
.modal>div{background:#fff;border-radius:18px;padding:22px 24px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal h2{margin-bottom:14px}.modal .fld{margin-bottom:12px}.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.cb{display:flex;gap:8px;align-items:center;margin:6px 0}
.modebar{display:flex;align-items:center;gap:14px;margin:0 0 12px;flex-wrap:wrap}
.modebar .seg button{padding:6px 16px;font-size:13.5px}
.modebar .hint{color:var(--mute);font-size:12.5px}
.kpi .v{font-size:12.5px;font-weight:700;color:var(--ink);margin-top:3px;opacity:.75}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vbar{display:block;height:5px;border-radius:9px;background:var(--soft);margin-top:4px;min-width:90px}.vbar i{display:block;height:100%;border-radius:9px;background:var(--navy)}
.sm-n{display:inline-block;min-width:24px;text-align:center;border-radius:8px;padding:1px 6px;font-weight:700;font-size:12.5px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.sm-0{color:#C5CBD8}
tr.drill{cursor:pointer}tr.drill:hover td{background:#F6F8FF}
tr.tot td{font-weight:800;background:var(--soft);color:var(--navy);position:sticky;bottom:0}
.vnote{color:var(--mute);font-size:12px;padding:10px 14px}
.pcgrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px}
.pck{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px;background:#fff;cursor:pointer;font:inherit;color:var(--ink)}
.pck b{display:block;font-size:13.5px;color:var(--navy)}.pck small{display:block;color:var(--mute);font-size:11.5px;line-height:1.35;margin-top:2px}.pck em{display:block;font-style:normal;color:var(--red);font-size:10.5px;font-weight:700;margin-top:3px}
.pck.on{border-color:var(--navy);background:#F3F6FF}.pck:hover{border-color:#9AA9D0}
.pcg{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700;margin:12px 0 6px}.pcg:first-child{margin-top:0}
.pccols{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:2px 0 12px}.pccols .cb{margin:3px 0}
.pccols-h{display:flex;justify-content:space-between;align-items:baseline}.pccols-h a{font-size:12px;cursor:pointer;color:var(--navy);font-weight:600}
.pcprev{width:100%;height:58vh;border:1px solid var(--line);border-radius:12px;margin-top:12px;background:#F3F5FA}
.pcnote{background:#F3F6FF;border-radius:10px;padding:8px 11px;color:var(--mute);font-size:12.5px;margin-bottom:12px}
@media (max-width:900px){.pcgrid{grid-template-columns:1fr}}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.bosses{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.bosses{grid-template-columns:repeat(2,minmax(0,1fr))}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;height:auto;min-height:100vh}
  .side{flex-direction:row;align-items:center;padding:8px 10px;gap:8px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .side img.logo{width:92px;margin:0 6px 0 0}.nav{display:flex;gap:2px;overflow:auto;flex:1}.nav button{width:auto;padding:8px 10px;margin:0;white-space:nowrap}.nav button svg{display:none}
  .side .foot{margin:0;border:0;padding:0}.side .me>div:last-child{display:none}.main{padding:14px 12px 80px;overflow:visible}
  .grid2{grid-template-columns:1fr}.tablewrap{max-height:none}.chk{grid-template-columns:1fr}.lk{grid-template-columns:1fr 1fr}
}
/* milestones, rail, side window, tracker, back/undo bar */
.tb{position:sticky;top:0;z-index:25;margin:-24px -28px 14px;padding:9px 28px;background:rgba(245,246,250,.94);backdrop-filter:blur(6px);display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.tb .crumb{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toast .tu{margin-left:14px;color:#FFD9A3;font-weight:700;cursor:pointer;text-decoration:underline}
.dw{display:grid;grid-template-columns:244px minmax(0,1fr);gap:16px;align-items:start}.dw.norail{grid-template-columns:minmax(0,1fr)}.dmain{min-width:0}

    toast("Creating the slides…"); await api("/api/deck/add", {...A, f}); closeModal(); await reload(); toast("Project added to the deck");
  }
  else if (a === "dk-retire") { const p = dkP(d.id); await api("/api/deck/retire", {...A, keys: [d.id], retired: !p.retired}); closeModal(); await reload(); }
  else if (a === "dk-move") { await api("/api/deck/move", {...A, keys: [d.id], where: d.w}); closeModal(); await reload(); }
  else if (a === "dk-delete") { if (confirm("Delete this project AND its slides from the base deck? (A backup is made first - you can restore it.)")) { await api("/api/deck/delete", {...A, keys: [d.id]}); closeModal(); await reload(); toast("Deleted - see Backups & undo to bring it back"); } }
  else if (a === "dk-restore") { if (confirm("Restore this backup as the base deck?")) { await api("/api/deck/restore", {...A, file: d.f}); closeModal(); await reload(); toast("Backup restored"); } }
  else if (a === "dk-open" || a === "dk-reveal") await api("/api/deck/openfile", {path: dk.result.path, reveal: a === "dk-reveal"});
  else if (a === "dk-generate") {
    const client = $("#dkclient").value.trim(); dk.client = client; store.set("dkClient", client);
    if (!client) return toast("Please enter the client / recipient name (step 2)", true);
    const sel = dk.rows.filter(p => !p.retired && dk.pick[p.id].show).map(p => ({id: p.id, category: dk.pick[p.id].category, version: dk.pick[p.id].version, show_value: !!(dk.pick[p.id].value && p.has_value)}));
    if (!sel.length) return toast("Tick at least one project", true);
    const leaks = dk.rows.filter(p => !p.retired && dk.pick[p.id].show && dk.pick[p.id].version === "Unnamed" && p.leaks.length);
    if (leaks.length && !confirm("These UNNAMED slides still seem to contain identifying words:\n\n • " + leaks.slice(0, 10).map(p => p.name + " → " + p.leaks.join(", ")).join("\n • ") + "\n\nGenerate anyway?")) return;
    dk.busy = true; dk.result = null; render();
    try { const r = await api("/api/deck/generate", {...A, client, selections: sel, save_defaults: false}); dk.result = r; toast("Deck created"); }
    catch (e) { /* toast shown */ }
    dk.busy = false; render();
  }
}

const INFO_DOCS = ["Information package received", "Pre-feasibility / APS", "FSR (feasibility study)", "Land available", "Concession agreement", "Government guarantee", "ESIA / permits", "Technical documents", "Project proposal submitted"];
const STAGE_RANK = ["Identified", "Shortlisted", "To be approached", "Approached", "In discussion", "Term sheet received", "Appointed"];
const stageOf = (tid, ty) => { let b = -1; links(tid, ty).forEach(l => { b = Math.max(b, STAGE_RANK.indexOf(l.status)); }); const st = b < 0 ? "None" : STAGE_RANK[b]; return st === "Term sheet received" && ty === "EPC" ? "In discussion" : st; };
const AGE_VALS = ["0–14 days", "15–30 days", "31–60 days", "61–90 days", "Over 90 days", "Date missing", "Never held"];
const mtgDays = t => t.meeting_status === "Held" && t.meeting_date ? daysSince(t.meeting_date) : null;
const mtgAge = t => { const d = mtgDays(t); return d === null ? (t.meeting_status === "Held" ? "Date missing" : "Never held") : d <= 14 ? AGE_VALS[0] : d <= 30 ? AGE_VALS[1] : d <= 60 ? AGE_VALS[2] : d <= 90 ? AGE_VALS[3] : AGE_VALS[4]; };
const ageCell = t => { const d = mtgDays(t), i = AGE_VALS.indexOf(mtgAge(t)); return `<span class="age a${i}" title="${d === null ? esc(mtgAge(t)) : "Last meeting held " + esc(t.meeting_date) + " (" + d + " days ago)" + (t.meeting_with ? " with " + esc(t.meeting_with) : "")}">${d === null ? (i === 5 ? "date?" : "never") : d + " d"}</span>`; };
const MSD = {
  meeting: {label: "Meeting with ministry / owner", short: "Meeting", vals: ["Not held", "To be scheduled", "Requested", "Scheduled", "Held"], get: t => t.meeting_status || "Not held"},
  mtgage: {label: "Days since last meeting", short: "Last meeting", vals: AGE_VALS, get: mtgAge},
  loi: {label: "LoI / EoI", short: "LoI / EoI", vals: ["Not sent", "In progress", "Sent · awaiting", "Accepted", "Negotiating", "Rejected", "Not applicable"],
        get: t => { const st = ((CK[t.id] || {})["LoI / EoI submitted"] || {}).state;
          if (t.loi_sent === "Yes") return ({Accepted: "Accepted", Negotiating: "Negotiating", Rejected: "Rejected"}[t.loi_response] || "Sent · awaiting");
          return st === "In progress" ? "In progress" : st === "N.A." ? "Not applicable" : "Not sent"; }},
  info: {label: "Information (see Readiness)", short: "Info", vals: ["Not yet", "Partial", "Received"],
          get: t => { const g = i => ((CK[t.id] || {})[i] || {}).state; if (g("Information package received") === "Yes" || g("FSR (feasibility study)") === "Yes") return "Received";
          return INFO_DOCS.some(i => ["Yes", "In progress"].includes(g(i))) ? "Partial" : "Not yet"; }},
  epc: {label: "EPC mapping", short: "EPC", vals: ["None", "Identified", "Shortlisted", "To be approached", "Approached", "In discussion", "Appointed", "Not needed"],
        get: t => ND[t.id + "|EPC"] === "Not needed" ? "Not needed" : stageOf(t.id, "EPC")},
  bank: {label: "Banks / lenders mapping", short: "Banks", vals: ["None", "Identified", "Shortlisted", "To be approached", "Approached", "In discussion", "Term sheet received", "Appointed"],
        get: t => stageOf(t.id, "Bank / Lender")},
  term: {label: "Bank term sheet", short: "Term sheet", vals: ["None", "Term sheet received"], get: t => links(t.id, "Bank / Lender").some(l => l.status === "Term sheet received") ? "Term sheet received" : "None"},
  review: {label: "Review outcome", short: "Review", vals: ["Pending", "Proceed", "Customise", "Hold", "Drop"], get: t => t.review_outcome || "Pending"},
};
const MSK = Object.keys(MSD);
const MSTONE = {mtgage: ["good", "good", "mid", "mid", "bad", "none", "none"], meeting: ["none", "mid", "mid", "mid", "good"], loi: ["none", "mid", "mid", "good", "mid", "bad", "none"], info: ["none", "mid", "good"], term: ["none", "good"],
                epc: ["none", "mid", "mid", "mid", "mid", "mid", "good", "good"], bank: ["none", "mid", "mid", "mid", "mid", "mid", "good", "good"], review: ["none", "good", "mid", "mid", "bad"]};

const daysSince = d => d ? Math.floor((Date.now() - new Date(d + "T00:00:00").getTime()) / 864e5) : null;

async function txCreate() {
  const v = id => ($("#" + id) || {}).value || "", name = v("nt-name").trim(); if (!name) return toast("A transaction needs a name", true);
  const fields = {name, country: v("nt-country").trim(), sector: v("nt-sector").trim(), structure: v("nt-structure").trim(), value: v("nt-value").trim(), status: v("nt-status"), client_type: v("nt-client"),
                  procurement: v("nt-proc"), introduced: v("nt-intro").trim(), received_date: v("nt-recv"), summary: v("nt-summary").trim()};
  let lead = v("nt-lead"); if (!lead) { const g = S.data.geo.find(x => x.country.toLowerCase() === fields.country.toLowerCase()); lead = g ? g.lead : ""; } if (lead) fields.lead = lead;
  const r = await api("/api/txn", {fields}); S.stack.pop(); await load();
  if (!T[r.id]) { closeDrawer(); const sw = S.data.enums.statuses.includes(fields.status) ? (fields.structure === "Financing only" ? "financing only" : "EPC not needed") : (fields.status === "On hold" ? "on hold" : "preliminary"); return toast("Created - but hidden by the switch at the top right. Switch on “Show " + sw + "” to see it."); }
  await openTxn(r.id, "track"); toast("Transaction created" + (lead ? " · owner " + lead : ""));
}

/* ---- counterparties: bulk add / edit / remove */
function parseBulk(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    let name = l, country = "";
    if (l.includes("\t")) { const p = l.split("\t"); name = p[0]; country = p[1] || ""; }
    else if (l.includes(";")) { const p = l.split(";"); name = p[0]; country = p[1] || ""; }
    else if (l.includes(",")) { const i = l.lastIndexOf(","), tail = l.slice(i + 1).trim(); if (tail && tail.length <= 30 && !/^(ltd|limited|inc|llc|co|corp|plc|sa|ag|gmbh|pte|pvt|nv|bv)\b/i.test(tail)) { name = l.slice(0, i); country = tail; } }
    return {name: name.trim(), country: country.trim()};
  }).filter(r => r.name);
}
function pbulkPreview() {
  const box = $("#pbprev"); if (!box) return; const type = ($("#pbtype") || {}).value, rows = parseBulk(($("#pbtext") || {}).value || "");
  const have = new Set(S.data.parties.filter(p => p.type === type).map(p => p.name.toLowerCase())), seen = new Set(); let nw = 0, dup = [];
  rows.forEach(r => { const k = r.name.toLowerCase(); if (seen.has(k)) return; seen.add(k); have.has(k) ? dup.push(r.name) : nw++; });
  box.innerHTML = rows.length ? `<b>${nw}</b> new to add${dup.length ? ` · <span style="color:var(--pre)">${dup.length} already exist and will be skipped: ${esc(dup.slice(0, 6).join(", "))}${dup.length > 6 ? "…" : ""}</span>` : ""}` : "Paste or type names above.";
  const b = $("#pbgo"); if (b) b.textContent = nw ? `Add ${nw} ${nw === 1 ? "counterparty" : "counterparties"}` : "Add";
}

  if (!list.length) h += `<tr><td colspan="20"><div class="empty">No transactions match these filters.</div></td></tr>`;

    h += `<tr class="row drill" data-drill="${mode}|${esc(x.k)}"><td><div class="tn">${mode === "status" ? `<span class="st ${cls(x.k)}">${esc(x.k)}</span>` : esc(x.k)}</div></td><td class="num" ${dm(x.k, "n", x.n)}><b>${x.n}</b></td>` +

let lastRev = null, lastMine = null, pollTimer = null;
function startPoll(ms) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch("/api/rev").then(r => r.json());
      const ae = document.activeElement, busy = (ae && ["INPUT", "TEXTAREA", "SELECT"].includes(ae.tagName) && ae.id !== "bipfile") || $("#modalroot").innerHTML || (topP() && topP().k === "form");
      if (lastRev !== null && (r.rev !== lastRev || r.lock.mine !== lastMine) && !busy && !S.openPop) await load();
      lastRev = r.rev; lastMine = r.lock.mine;
    } catch (e) { /* server closed */ }
  }, ms);
}
startPoll(12000);

    wrap.innerHTML = `<button id="acctchip" aria-label="Account menu"
        style="display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.95);border:1px solid #d9dee6;border-radius:999px;padding:4px 10px;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer;max-width:48vw">
        <span id="acctdot" style="width:8px;height:8px;border-radius:50%;flex:0 0 auto"></span>
        <span id="acctname" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
        <span style="color:#888">▾</span></button>
      <div id="acctmenu" style="display:none;position:absolute;right:0;top:34px;background:#fff;border:1px solid #d9dee6;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.16);min-width:170px;overflow:hidden"></div>`;
    document.body.appendChild(wrap);
    document.getElementById("acctchip").addEventListener("click", e => {
      e.stopPropagation();
      const m = document.getElementById("acctmenu"); m.style.display = m.style.display === "none" ? "block" : "none";
    });
    document.addEventListener("click", () => { const m = document.getElementById("acctmenu"); if (m) m.style.display = "none"; });
    wrap.querySelector("#acctmenu").addEventListener("click", async e => {
      const a = e.target.dataset.acct; if (a) { e.stopPropagation(); document.getElementById("acctmenu").style.display = "none"; await acctAction(a); }
    });
  }
  document.getElementById("acctdot").style.background = roleColor;
  document.getElementById("acctname").textContent = nm;
  document.getElementById("acctmenu").innerHTML =
      `<div style="padding:9px 12px;border-bottom:1px solid #eef1f5"><div style="font-weight:600">${esc(nm)}</div>`
    + `<div style="color:#fff;background:${roleColor};border-radius:6px;padding:1px 7px;font-size:11px;display:inline-block;margin-top:3px">${roleTxt}${S.me.role === "viewer" ? " · read only" : ""}</div></div>`
    + (S.me.role === "master" ? `<a data-acct="users" style="display:block;padding:9px 12px;cursor:pointer;color:#1d4ed8">Users &amp; permissions</a>` : "")
    + `<a data-acct="pw" style="display:block;padding:9px 12px;cursor:pointer;color:#333">Change password</a>`
    + `<a data-acct="logout" style="display:block;padding:9px 12px;cursor:pointer;color:#b91c1c;border-top:1px solid #eef1f5">Sign out</a>`;
}

fetch("/api/me").then(r => r.json()).then(me => { S.me = me; accountBar(); if (me && me.shared) startPoll(4000); })
  .catch(() => { S.me = null; })
  .finally(() => { load().then(() => { fetch("/api/rev").then(r => r.json()).then(r => { lastRev = r.rev; lastMine = r.lock.mine; }); }); });
</script>
</body>
</html>
